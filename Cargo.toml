[workspace]
resolver = "3"
members = ["crates/ama"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_yaml_ng = "0.10"
thiserror = "2.0.21"
assert_cmd = "2.2.2"
predicates = "3.1.4"
proptest = "1"
tempfile = "3"
