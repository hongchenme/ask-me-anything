[workspace]
resolver = "3"
members = ["crates/ama"]

[workspace.package]
# Members set their own `version`; kept here for any future member
# that wants to inherit it.
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
clap = { version = "4.6.7", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_yaml_ng = "0.10"
thiserror = "2.0.21"
assert_cmd = "2.2.2"
predicates = "3.1.4"
proptest = "1"
tempfile = "3"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
