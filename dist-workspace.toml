[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.33.0"
# CI backends to support
ci = "github"
# The installers to generate for each app. "shell" is the curl-pipe-sh
# installer; it places `ama` on PATH, and `ama setup` then creates the `@@`
# alias, because rustc rejects a crate named `@@` so it cannot be a [[bin]].
installers = ["shell"]
# Unix only: the headline feature is a bash/zsh Enter hook, so a Windows
# build could offer `ama ask` but never `@@`.
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["aarch64-apple-darwin", "aarch64-unknown-linux-gnu", "x86_64-apple-darwin", "x86_64-unknown-linux-gnu"]

# Match install.sh's default rather than cargo-dist's `~/.cargo/bin`. The
# person the curl install exists for may have no Rust toolchain at all, and
# telling them to `source ~/.cargo/env` to finish is a strange first step.
install-path = "~/.local/bin"
